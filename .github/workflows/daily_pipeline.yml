name: Daily FX & Data Pipeline

on:
  schedule:
    # Runs automatically at 18:00 UTC every day
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

#give GitHub Actions permission to commit and push
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4.2.2

      - name: Set up Python environment
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests sqlalchemy psycopg2-binary python-dotenv

      - name: Execute FX Update Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python daily-fx-rates/src/daily_fx_rates.py

      - name: Commit and push updated local CSV backup back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-fx-rates/data/fx_rates.csv || true
          git commit -m "auto: update fx_rates.csv [skip ci]" || exit 0
          git push
      
      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx-rates-csv
          path: daily-fx-rates/data/fx_rates.csv