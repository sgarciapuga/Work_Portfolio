name: Create Date Table

on:
  schedule:
    # Runs automatically at 03:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-date-table:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python environment
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.14.6'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          attempts=3
          count=0
          until [ $count -ge $attempts ]
          do
            pip install -r requirements.txt && break
            count=$((count+1))
            sleep $((count*5))
          done
          if [ $count -ge $attempts ]; then echo "pip install failed after $attempts attempts"; exit 1; fi

      - name: Execute date table script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python create-date-table/create_date_table.py
      - name: Verify date_table rows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python create-date-table/check_table_state.py
      - name: Export date_table to CSV
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python create-date-table/export_date_table.py
      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: date_table_csv
          path: create-date-table/data/date_table.csv

      - name: Commit and push CSV backup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add create-date-table/data/date_table.csv || true
          # Only commit and push if there are changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit. Skipping push."
          else
            git commit -m "auto: update date_table.csv [skip ci]"
            git push
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          payload=$(jq -n --arg text "Workflow '${{ github.workflow }}' failed for ${{ github.ref }} (run: ${{ github.run_number }}). <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>" '{text: $text}')
          curl -s -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK"
